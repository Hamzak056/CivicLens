<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicLens / داغِ شہر</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Beige / Off-White Warm Palette */
        body {
            background-color: #fcfbf9;
            color: #2c2925;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-emerald-700 mb-2 tracking-tight">
                CivicLens / داغِ شہر
            </h1>
            <p class="text-stone-600 font-medium text-lg">
                AI Municipal Issue Reporter with Direct Escalation (SDG 11)
            </p>
        </header>

        <!-- Upload & Location Section -->
        <div class="bg-white border border-stone-200 rounded-3xl p-6 md:p-8 shadow-xl shadow-stone-200/50 mb-8">
            <h2 class="text-xl font-bold mb-4 text-emerald-800 flex items-center gap-2">
                <span>📸</span> 1. Snap, Locate & Upload
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-semibold text-stone-700 mb-1">City / Region</label>
                    <input
                        type="text"
                        id="cityInput"
                        value="Rawalpindi / Islamabad"
                        class="w-full bg-stone-50 border border-stone-300 rounded-xl px-4 py-2.5 text-stone-800 font-medium focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 mb-4 transition"
                    />

                    <label class="block text-sm font-semibold text-stone-700 mb-1">Exact Location / Landmark (e.g. Street 4, Sector I-10/2)</label>
                    <div class="flex gap-2">
                        <input
                            type="text"
                            id="locationInput"
                            placeholder="Enter exact street or landmark..."
                            class="w-full bg-stone-50 border border-stone-300 rounded-xl px-4 py-2.5 text-stone-800 font-medium focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 transition"
                        />
                        <button
                            onclick="fetchGPS()"
                            class="bg-amber-600 hover:bg-amber-700 px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap transition cursor-pointer text-white shadow-md shadow-amber-600/20"
                        >
                            📍 GPS
                        </button>
                    </div>
                    <p id="gpsText" class="text-xs font-semibold text-amber-700 mt-2"></p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-stone-700 mb-1">Upload Issue Image</label>
                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        onchange="previewImage(event)"
                        class="w-full text-sm text-stone-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-emerald-700 file:text-white hover:file:bg-emerald-800 cursor-pointer border border-stone-200 rounded-xl bg-stone-50 p-1"
                    />
                    <div id="previewContainer" class="mt-4 flex justify-center hidden">
                        <img id="imagePreview" alt="Preview" class="max-h-44 rounded-2xl border-2 border-stone-200 shadow-md object-cover" />
                    </div>
                </div>
            </div>

            <button
                id="analyzeBtn"
                onclick="analyzeIssue()"
                disabled
                class="w-full bg-emerald-700 hover:bg-emerald-800 disabled:bg-stone-300 disabled:text-stone-500 text-white font-bold py-3.5 rounded-2xl transition duration-200 shadow-lg shadow-emerald-700/20 cursor-pointer disabled:cursor-not-allowed"
            >
                Analyze & Generate Official Complaints 🚀
            </button>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="space-y-6 hidden">
            <div class="bg-white border border-stone-200 rounded-3xl p-6 shadow-xl shadow-stone-200/50 grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                <div class="bg-stone-50 p-4 rounded-2xl border border-stone-200">
                    <span class="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-1">Issue Detected</span>
                    <span id="resIssueType" class="text-base font-extrabold text-stone-900"></span>
                </div>
                <div class="bg-stone-50 p-4 rounded-2xl border border-stone-200">
                    <span class="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-1">Department</span>
                    <span id="resDept" class="text-base font-extrabold text-emerald-700"></span>
                </div>
                <div class="bg-stone-50 p-4 rounded-2xl border border-stone-200">
                    <span class="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-1">Severity Level</span>
                    <span id="resSeverity" class="inline-block px-3 py-1 mt-0.5 rounded-full text-xs font-extrabold bg-amber-100 text-amber-800 border border-amber-200"></span>
                </div>
            </div>

            <div class="bg-white border border-stone-200 rounded-3xl p-6 shadow-xl shadow-stone-200/50">
                <h3 class="text-base font-bold text-emerald-800 mb-2 flex items-center gap-2">📍 Target Incident Location</h3>
                <p id="resLocation" class="text-stone-700 bg-stone-50 p-3.5 rounded-2xl border border-stone-200 font-semibold"></p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- English Letter -->
                <div class="bg-white border border-stone-200 rounded-3xl p-6 shadow-xl shadow-stone-200/50 flex flex-col justify-between">
                    <div>
                        <h3 class="text-base font-bold text-emerald-800 mb-3 flex items-center gap-2">📄 English Complaint Letter</h3>
                        <div id="resEnglish" class="bg-stone-50 p-4 rounded-2xl text-xs font-medium text-stone-700 whitespace-pre-line border border-stone-200 max-h-96 overflow-y-auto leading-relaxed"></div>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <button onclick="copyText('resEnglish')" class="flex-1 bg-stone-200 hover:bg-stone-300 text-stone-800 text-xs font-bold py-2.5 px-3 rounded-xl transition cursor-pointer">Copy 📋</button>
                        <button onclick="shareWhatsApp('resEnglish')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition cursor-pointer shadow-md shadow-emerald-600/20">💬 WhatsApp</button>
                        <button onclick="sendBackendEmail('English')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition cursor-pointer shadow-md shadow-blue-600/20">📧 Direct Email</button>
                        <button onclick="sendSMS('English')" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition cursor-pointer shadow-md shadow-amber-600/20">📱 SMS</button>
                    </div>
                </div>

                <!-- Urdu Application -->
                <div class="bg-white border border-stone-200 rounded-3xl p-6 shadow-xl shadow-stone-200/50 flex flex-col justify-between">
                    <div>
                        <h3 class="text-base font-bold text-emerald-800 mb-3 flex items-center justify-end gap-2">رسمي اردو درخواست 📜</h3>
                        <div id="resUrdu" class="bg-stone-50 p-4 rounded-2xl text-xs font-medium text-stone-800 whitespace-pre-line border border-stone-200 max-h-96 overflow-y-auto text-right font-serif leading-loose" dir="rtl"></div>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <button onclick="copyText('resUrdu')" class="flex-1 bg-stone-200 hover:bg-stone-300 text-stone-800 text-xs font-bold py-2.5 px-3 rounded-xl transition cursor-pointer">کاپی کریں 📋</button>
                        <button onclick="shareWhatsApp('resUrdu')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition cursor-pointer shadow-md shadow-emerald-600/20">💬 واٹس ایپ</button>
                        <button onclick="sendBackendEmail('Urdu')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition cursor-pointer shadow-md shadow-blue-600/20">📧 براہ راست ای میل</button>
                        <button onclick="sendSMS('Urdu')" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition cursor-pointer shadow-md shadow-amber-600/20">📱 ایس ایم ایس</button>
                    </div>
                </div>
            </div>

            <div class="bg-white border border-stone-200 rounded-3xl p-6 shadow-xl shadow-stone-200/50">
                <h3 class="text-base font-bold text-amber-700 mb-3 flex items-center gap-2">🛠️ Temporary Safety & Action Steps</h3>
                <ul id="resMitigation" class="list-disc list-inside text-stone-700 text-sm font-medium space-y-2 mb-4 pl-2"></ul>
                <div class="bg-stone-50 p-3.5 rounded-2xl border border-stone-200 text-sm font-semibold text-stone-800">
                    <span class="text-emerald-700 font-bold">Official Helpline: </span> <span id="resHelpline"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let base64Image = null;
        let coordsData = null;
        let analysisResult = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    base64Image = reader.result;
                    document.getElementById('imagePreview').src = base64Image;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('analyzeBtn').disabled = false;
                };
                reader.readAsDataURL(file);
            }
        }

        function fetchGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        coordsData = { lat: position.coords.latitude, lng: position.coords.longitude };
                        document.getElementById('gpsText').innerText = `GPS Captured: ${coordsData.lat.toFixed(4)}, ${coordsData.lng.toFixed(4)}`;
                        alert('GPS Coordinates captured successfully!');
                    },
                    () => alert('Unable to retrieve GPS location.')
                );
            } else {
                alert('Geolocation is not supported by your browser.');
            }
        }

        async function analyzeIssue() {
            if (!base64Image) return;
            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.innerText = 'Gemini AI is analyzing issue & drafting letters...';

            const city = document.getElementById('cityInput').value;
            const exactLoc = document.getElementById('locationInput').value;
            const fullLocation = exactLoc ? `${exactLoc}, ${city}` : city;

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image, location: fullLocation, coords: coordsData })
                });
                const data = await res.json();
                if (res.ok) {
                    analysisResult = data;
                    document.getElementById('resIssueType').innerText = data.issueType;
                    document.getElementById('resDept').innerText = data.department;
                    document.getElementById('resSeverity').innerText = `${data.severity} Severity`;
                    document.getElementById('resLocation').innerText = data.exactLocation;
                    document.getElementById('resEnglish').innerText = data.englishComplaint;
                    document.getElementById('resUrdu').innerText = data.urduComplaint;
                    document.getElementById('resHelpline').innerText = data.helpline;

                    const mitList = document.getElementById('resMitigation');
                    mitList.innerHTML = '';
                    data.mitigationSteps.forEach(step => {
                        const li = document.createElement('li');
                        li.innerText = step;
                        mitList.appendChild(li);
                    });

                    document.getElementById('resultsSection').classList.remove('hidden');
                } else {
                    alert(data.error || 'Failed to analyze the issue.');
                }
            } catch (err) {
                console.error(err);
                alert('Server connection error occurred.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Analyze & Generate Official Complaints 🚀';
            }
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard successfully!');
        }

        function shareWhatsApp(elementId) {
            const text = document.getElementById(elementId).innerText;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        async function sendBackendEmail(type) {
            if (!analysisResult) return;
            const subject = type === 'English' ? `Urgent Complaint: ${analysisResult.issueType}` : `فوری شکایت: ${analysisResult.issueType}`;
            const message = type === 'English' ? analysisResult.englishComplaint : analysisResult.urduComplaint;

            alert('Sending email directly via Python Flask backend to azkakhaliq100204@gmail.com...');
            try {
                const res = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject, message })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Email successfully sent to azkakhaliq100204@gmail.com!');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Failed to connect to email server.');
            }
        }

        function sendSMS(type) {
            if (!analysisResult) return;
            const text = type === 'English' 
                ? `Civic Alert: ${analysisResult.issueType} at ${analysisResult.exactLocation}.`
                : `شکایت: ${analysisResult.issueType} بمقام ${analysisResult.exactLocation}`;
            window.location.href = `sms:03705546767?body=${encodeURIComponent(text)}`;
        }
    </script>
</body>
</html>
